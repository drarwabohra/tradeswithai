<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#051A23" />
  <!-- 3 candles, thicker for small sizes -->
  <g stroke="#A8E10D" stroke-width="3" stroke-linecap="round">
    <line x1="19" y1="29" x2="19" y2="52" />
    <line x1="32" y1="21" x2="32" y2="44" />
    <line x1="45" y1="13" x2="45" y2="36" />
  </g>
  <g fill="#A8E10D">
    <rect x="14" y="33" width="10" height="14" rx="1.5" />
    <rect x="27" y="25" width="10" height="13" rx="1.5" />
    <rect x="40" y="16" width="10" height="15" rx="1.5" />
  </g>
  <!-- node lines above and below -->
  <polyline points="19,27 32,19 45,11" stroke="#A8E10D" stroke-width="2.6" stroke-linejoin="round" />
  <polyline points="19,54 32,46 45,38" stroke="#41C4E1" stroke-width="2.6" stroke-linejoin="round" />
  <circle cx="19" cy="27" r="3.4" fill="#A8E10D" />
  <circle cx="32" cy="19" r="3.4" fill="#41C4E1" />
  <circle cx="45" cy="11" r="3.4" fill="#A8E10D" />
  <circle cx="19" cy="54" r="3.4" fill="#A8E10D" />
  <circle cx="45" cy="38" r="3.4" fill="#41C4E1" />
</svg>
